name: Sync Templates to Passport

on:
  push:
    branches:
      - main
    paths:
      - 'article-templates/**'
      - 'admin-templates/**'
      - 'assets/**'

# Shared with sync-from-passport.yml so push-to-Passport and pull-from-Passport
# never run at the same time. cancel-in-progress=false means we wait, not skip.
concurrency:
  group: passport-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Push templates and assets to Passport
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need history so we can diff against ${{ github.event.before }} to
          # determine which templates/assets actually changed in this push.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute changed paths
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [[ -z "$BEFORE" || "$BEFORE" == "$ZERO" ]]; then
            # New branch / force push / unknown base — fall back to full push.
            echo "full_push=true" >> "$GITHUB_OUTPUT"
            echo "No before-SHA available; will run a full push."
          else
            git diff --name-only "$BEFORE" "${{ github.sha }}" > /tmp/changed.txt
            echo "Changed paths in this push:"
            cat /tmp/changed.txt
            echo "full_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push templates and assets to Passport
        run: |
          if [[ "${{ steps.changes.outputs.full_push }}" == "true" ]]; then
            node src/push.js 2>&1
          else
            node src/push.js --changed-from /tmp/changed.txt 2>&1
          fi
        env:
          INSTANCE_HOST: ${{ secrets.INSTANCE_HOST }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
