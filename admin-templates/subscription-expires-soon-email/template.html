{{ $theme := theme }}
{{ $instance := instance }}
<style>{{ assetBody "passport_admin.css"}}</style>
<table style="display: block; padding-top: 24px;">
    <tbody>
        <tr>
            <td class="email-header">
                <a target="_blank" href="{{ $instance.metadata.home}}">
                    {{ if $theme.banner }}
                        <img src="{{ $theme.banner }}" border="0" alt="{{ $instance.title }}">
                    {{ else }}
                        <span class="email-header-text">{{ $instance.title }}</span>
                    {{ end }}
                </a>
            </td>
        </tr>
        <tr>
            <td>
                <br>
                <h4>
                    Hi {{ .member.name }},
                </h4>
                <h4>
                    Your subscription will expire {{ timeFormat .subscription.ends_at "LL"}}.
                </h4>
                <h4>
                    To manage your subscription please sign in.
                </h4>
                <br>
            </td>
        </tr>
        <tr>
            <td>
                <a target="_blank" href="{{ session (member `/account`) }}" class="button">
                    <span>Sign In</span>
                </a>
            </td>
        </tr>
    </tbody>
</table>
